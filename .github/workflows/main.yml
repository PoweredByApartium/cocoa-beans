name: Main pipeline workflow

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      name:
        description: 'Version name'
        required: true
        type: string
      group:
        type: choice
        description: Group
        options:
          - net.apartium.cocoa-beans
          - dev.apartium.cocoa-beans

jobs:
  checkout:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

  test_writerside:
    needs: checkout
    permissions:
      contents: read
    uses: ./.github/workflows/callable.writerside.yml

  publish_writerside:
    if: github.event_name != 'pull_request'
    needs: test_writerside
    permissions:
      contents: read
    uses: ./.github/workflows/callable.writerside-publish.yml
    with:
      VERSION: ${{ github.event.inputs.name || 'snapshot' }}
    secrets:
      GH_PAGES_TOKEN: ${{ secrets.GH_PAGES_TOKEN }}

  run_tests:
    needs: checkout
    permissions:
      contents: read
      checks: write
    uses: ./.github/workflows/callable.test.yml
    secrets:
      SONAR_PROP_TOKEN: ${{ secrets.SONAR_PROP_TOKEN }}

  build:
    needs: run_tests
    permissions:
      contents: read
    uses: ./.github/workflows/callable.build.yml
    with:
      VERSION: ${{ github.event.inputs.name }}

  release:
    if: github.event_name == 'workflow_dispatch'
    needs: run_tests
    permissions:
      contents: write
    uses: ./.github/workflows/callable.release.yml
    with:
      VERSION: ${{ github.event.inputs.name }}
  hangar:
    if: github.event_name == 'workflow_dispatch'
    needs: release
    permissions:
      contents: read
    uses: ./.github/workflows/callable.hangar.yml
    secrets:
      HANGAR_TOKEN: ${{ secrets.HANGAR_TOKEN }}
    with:
      VERSION: ${{ github.event.inputs.name }}

  maven:
    if: github.event_name == 'workflow_dispatch'
    needs: release
    permissions:
      contents: read
    uses: ./.github/workflows/callable.maven.yml
    with:
      VERSION: ${{ github.event.inputs.name }}
      GROUP: ${{ github.event.inputs.group }}
    secrets:
      OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
      OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
      SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}
      SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
